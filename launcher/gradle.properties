# Memoria para Gradle (R8 la necesita: con poca memoria la optimización es más lenta)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Cerrar el daemon a los 3 minutos de inactividad para no retener RAM en la PC
org.gradle.daemon.idletimeout=180000
# Reusar resultados de compilaciones anteriores y compilar en paralelo
org.gradle.caching=true
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# v0.56.0 (ADR-0012): el motor de Android Auto lee el paquete de la app desde acá
carlink.applicationId=com.axel.onixlauncher
carlink.debugApplicationIdSuffix=
